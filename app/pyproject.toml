[project]
name = "reading-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.3",
    "playwright>=1.65.0",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
